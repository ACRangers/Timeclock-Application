<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>AC Rangers Timeclock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sign in -->
  <section id="login" class="screen">
    <div class="login-card">
      <h1>Timeclock</h1>
      <p class="sub">AC Rangers</p>

      <label for="login-user">Who are you?</label>
      <select id="login-user"><option value="">Select your name</option></select>

      <div id="pin-block" hidden>
        <label for="login-pin" id="pin-label">Enter your PIN</label>
        <input id="login-pin" type="password" inputmode="numeric" pattern="\d*" maxlength="4"
               autocomplete="off" placeholder="••••">
        <p class="hint" id="pin-hint"></p>
      </div>

      <p class="error" id="login-error" hidden></p>
      <button id="login-btn" class="primary" disabled>Sign in</button>
    </div>
  </section>

  <!-- Clock -->
  <section id="clock" class="screen" hidden>
    <header class="bar">
      <span id="clock-who"></span>
      <button id="signout" class="link">Sign out</button>
    </header>

    <div class="clock-body">
      <p class="status-label" id="clock-status">Not clocked in</p>
      <p class="timer" id="clock-timer">—</p>
      <p class="today" id="clock-today"></p>
      <button id="clock-btn" class="big">Clock In</button>
    </div>
  </section>

  <!-- My Day -->
  <section id="day" class="screen" hidden>
    <header class="bar">
      <button id="day-prev" class="link">‹</button>
      <span id="day-date"></span>
      <button id="day-next" class="link">›</button>
    </header>

    <div class="day-body">
      <div id="day-sessions" class="sessions"></div>
      <div id="day-hours" class="hours"></div>
      <p class="framing">
        A blank hour is not an idle hour. Meetings, training, one long call, and work done
        directly in ServiceTitan never show up here.
      </p>
      <p class="stamp" id="day-stamp"></p>
    </div>
  </section>

  <!-- Clock-out -->
  <div id="out-modal" class="overlay" hidden>
    <div class="modal">
      <h2>What did you work on?</h2>
      <textarea id="out-note" rows="4" placeholder="Anything the system wouldn't have recorded"></textarea>
      <label for="out-job">Job number <span class="opt">(optional)</span></label>
      <input id="out-job" type="text" inputmode="numeric" placeholder="e.g. 48213">
      <p class="error" id="out-error" hidden></p>
      <div class="modal-actions">
        <button id="out-cancel" class="ghost">Cancel</button>
        <button id="out-confirm" class="primary">Clock Out</button>
      </div>
    </div>
  </div>

  <nav id="tabs" class="tabs" hidden>
    <button data-view="clock" class="active">Clock</button>
    <button data-view="day">My Day</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
